plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minimal.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId "com.minimal.tvhome"
        minSdk 21
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
